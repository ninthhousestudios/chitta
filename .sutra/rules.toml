# .sutra/rules.toml — Architectural constraints for chitta
#
# Generated by vidhi-sutra-adopt (2026-08-07) from the import graph + stated
# principles in docs/principles.md, CONTEXT.md, docs/official/v0.0.2/architecture.md.
#
# Severity levels:
#   blocking      — guard denies edits that introduce these
#   advisory      — warning in review, agent proceeds
#   informational — tracked in review output, silent otherwise
#
# chitta is a single lib+binary crate; all boundaries are within src/.

# ═══════════════════════════════════════════════════════════════════
# Write path stays extraction-free  (principles 3 & 9)
# ═══════════════════════════════════════════════════════════════════
# "Write fast, enrich lazily": the write path does validate → embed → insert
# and nothing else. No synchronous entity extraction and no synchronous LLM
# calls on store/update — enrichment runs in the /reflect (synthesis) job.
# The graph confirms store.rs/update.rs import neither today; these lock it in.

[[constraint]]
kind = "forbidden_dep"
from = "src/tools/store.rs"
to = "src/synthesis/**"
name = "store-no-synthesis"
severity = "blocking"
provenance = "docs/principles.md #3 Write fast, enrich lazily; #9 No write-time extraction"

[[constraint]]
kind = "forbidden_dep"
from = "src/tools/update.rs"
to = "src/synthesis/**"
name = "update-no-synthesis"
severity = "blocking"
provenance = "docs/principles.md #3 Write fast, enrich lazily; #9 No write-time extraction"

[[constraint]]
kind = "forbidden_dep"
from = "src/tools/store.rs"
to = "src/llm.rs"
name = "store-no-llm"
severity = "blocking"
provenance = "docs/principles.md #3 Write fast, enrich lazily"

[[constraint]]
kind = "forbidden_dep"
from = "src/tools/update.rs"
to = "src/llm.rs"
name = "update-no-llm"
severity = "blocking"
provenance = "docs/principles.md #3 Write fast, enrich lazily"

# ═══════════════════════════════════════════════════════════════════
# Layering: data + core-type modules sit below presentation
# ═══════════════════════════════════════════════════════════════════
# The data layer (db) and core type modules (error, config, validators) must
# not depend on tool handlers. The graph confirms all four are clean today.
#
# NOTE: facets.rs currently VIOLATES this same boundary (it imports
# tools::search::AppliesTo). That edge fuses core + db + all 11 tools into one
# 15-file cycle. It is tracked in yojana chitta/50, whose final step adds the
# matching `facets-below-presentation` blocking constraint here once fixed.

[[constraint]]
kind = "forbidden_dep"
from = "src/db.rs"
to = "src/tools/**"
name = "data-layer-below-presentation"
severity = "blocking"
provenance = "docs/official/v0.0.2/architecture.md — wire → core → db type flow"

[[constraint]]
kind = "forbidden_dep"
from = "src/error.rs"
to = "src/tools/**"
name = "error-below-presentation"
severity = "blocking"

[[constraint]]
kind = "forbidden_dep"
from = "src/config.rs"
to = "src/tools/**"
name = "config-below-presentation"
severity = "blocking"

[[constraint]]
kind = "forbidden_dep"
from = "src/validators.rs"
to = "src/tools/**"
name = "validators-below-presentation"
severity = "blocking"

# ═══════════════════════════════════════════════════════════════════
# Fan-in guardrail
# ═══════════════════════════════════════════════════════════════════
# db.rs is the data hub (fan-in 25, legitimately high). This guardrail is set
# ~30% above current to catch it accumulating new responsibilities, not to
# prevent normal use.

[[constraint]]
kind = "max_fan_in"
target = "src/db.rs"
threshold = 32
name = "db-fan-in-guardrail"
severity = "advisory"

# ═══════════════════════════════════════════════════════════════════
# Pattern discipline  (forbidden_pattern — introduced-only semantics;
# pre-existing matches are grandfathered by the guard)
# ═══════════════════════════════════════════════════════════════════
# Test code (#[cfg(test)]) is excluded by default. These mirror CLAUDE.md
# coding_discipline and the workspace [lints.clippy] baseline, but fire at
# edit time — before a cargo cycle, and even when clippy isn't run.

# Makes the [lints.clippy] baseline tamper-resistant: the sanctioned paths are
# fixing the lint, #[expect(lint, reason=...)], or an out-of-band waiver.
# Two existing matches (#[allow(deprecated)] in main.rs, #[allow(dead_code)] in
# embedding.rs) are grandfathered; convert to #[expect] when convenient.
[[constraint]]
kind = "forbidden_pattern"
language = "rust"
query = '''
(attribute_item (attribute (identifier) @m (#eq? @m "allow"))) @match
(inner_attribute_item (attribute (identifier) @m (#eq? @m "allow"))) @match
'''
name = "no-allow-attributes"
scope = "src/"
severity = "blocking"
provenance = "workspace [lints.clippy] baseline"

# Edit-time twin of clippy::unwrap_used (warn). Prefer .expect("invariant: ...")
# or ? propagation. Mutex lock().unwrap() poisoning idiom: waive with rationale.
[[constraint]]
kind = "forbidden_pattern"
language = "rust"
query = '(call_expression function: (field_expression field: (field_identifier) @m (#eq? @m "unwrap"))) @match'
name = "no-unwrap"
scope = "src/"
severity = "advisory"
provenance = "workspace [lints.clippy] baseline / CLAUDE.md Panic Discipline"

# Edit-time twin of clippy::{todo,unimplemented} (warn). Both panic at runtime.
[[constraint]]
kind = "forbidden_pattern"
language = "rust"
query = '(macro_invocation macro: (identifier) @m (#match? @m "^(todo|unimplemented)$")) @match'
name = "no-todo-unimplemented"
scope = "src/"
severity = "advisory"
provenance = "workspace [lints.clippy] baseline"

# Forces future production unsafe blocks through the waiver flow with an audited
# safety argument. Zero production matches today (all unsafe is in cfg(test)).
[[constraint]]
kind = "forbidden_pattern"
language = "rust"
query = '(unsafe_block) @match'
name = "unsafe-requires-waiver"
scope = "src/"
severity = "advisory"
provenance = "CLAUDE.md No Lint Silencing — unsafe states its invariant"

# CLAUDE.md forbids Clone-Driven Development. Advisory: legitimate uses exist
# (Arc sharing, Copy types, owned values at API boundaries). Grandfathered.
[[constraint]]
kind = "forbidden_pattern"
language = "rust"
query = '(call_expression function: (field_expression field: (field_identifier) @m (#eq? @m "clone"))) @match'
name = "no-clone-driven-dev"
scope = "src/"
severity = "advisory"
provenance = "CLAUDE.md coding_discipline — No Clone-Driven Development"

# ═══════════════════════════════════════════════════════════════════
# Conventions
# ═══════════════════════════════════════════════════════════════════
# This sutra version replaced the [conventions] suppress/exempt block with an
# on-the-fly deviation report (sutra surfaces meaningful convention drift
# directly), so no suppress list is maintained here. The auto-detected set is
# dominated by tautological/structural facts (functions have signatures, methods
# take self, symbols in dir X are in dir X); the meaningful patterns to watch
# are returns_result → vis:pub and is_async → returns_result.
